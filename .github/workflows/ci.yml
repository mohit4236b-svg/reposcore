name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev redis-tools git-lfs
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-dev.txt --verbose
        shell: bash

      - name: Check Python syntax
        run: python -m py_compile app.py reposcore_utils.py reposcore_cli.py
        shell: bash

      - name: Run tests
        run: pytest tests/ -v --tb=long
        env:
          REDIS_URL: redis://localhost:6379/0
          GITHUB_ACTIONS: "true"
        shell: bash

      - name: Check for large files (>5MB outside LFS)
        run: |
          # Get list of files tracked by LFS
          lfs_tracked=$(git lfs ls-files 2>/dev/null | awk '{print $NF}')
          # Find large files not in .git, not in build artifacts, not images, and not LFS-tracked
          large_files=""
          while IFS= read -r f; do
            is_lfs=false
            for lfs_file in $lfs_tracked; do
              if [ "$f" = "$lfs_file" ]; then
                is_lfs=true
                break
              fi
            done
            if [ "$is_lfs" = false ]; then
              large_files="$large_files$f"
            fi
          done < <(find . -type f -size +5M ! -path "./.git/*" ! -path "*/site-packages/*" ! -path "*/vendor/*" ! -path "*/venv/*" ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.gif" ! -name "*.svg" ! -name "*.ico")
          if [ -n "$large_files" ]; then
            echo "ERROR: The following files are larger than 5MB and should be tracked with Git LFS:"
            echo "$large_files"
            echo ""
            echo "To track them with LFS, run:"
            echo "  git lfs track \"<filename>\""
            echo "  git add <filename>"
            echo "  git commit"
            exit 1
          fi
          echo "No large files found outside LFS. Check complete."
        shell: bash
