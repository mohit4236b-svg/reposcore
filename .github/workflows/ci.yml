name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-dev.txt --verbose
        shell: bash

      - name: Check Python syntax
        run: python -m py_compile app.py reposcore_utils.py reposcore_cli.py
        shell: bash

      - name: Run tests
        run: pytest tests/ -v
        env:
          REDIS_URL: redis://localhost:6379/0
        shell: bash

      - name: Check for large files (>5MB outside LFS)
        run: |
          find . -type f -size +5M ! -path "./.git/*" ! -name "*.git*" | while read f; do
            if ! git lfs ls-files 2>/dev/null | grep -q "$(echo "$f" | sed 's/.*\///')"; then
              echo "ERROR: File $f is larger than 5MB and not tracked by LFS"
              echo "Please track it with: git lfs track \"$f\""
              exit 1
            fi
          done
          echo "No large untracked files found"
        shell: bash
