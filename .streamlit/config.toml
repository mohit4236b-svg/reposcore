# =============================================================================
# Streamlit Configuration
# =============================================================================
# Repository: https://github.com/yourusername/reposcore
# Documentation: https://docs.streamlit.io

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
serverAddress = "localhost"
gatherUsageStats = false

[theme]
primaryColor = "#00b4d8"
backgroundColor = "#1e1e2e"
secondaryBackgroundColor = "#2a2a3e"
textColor = "#e2e8f0"
font = "sans serif"

[runner]
magicEnabled = true
fastReruns = true
