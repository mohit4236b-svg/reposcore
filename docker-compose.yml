# =============================================================================
# RepoScore - Full Stack Deployment
# =============================================================================
# Orchestrates Streamlit app, FastAPI backend, and Redis cache
#
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Redis Cache - Shared between app and API
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: reposcore_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - reposcore_network

  # ---------------------------------------------------------------------------
  # Streamlit App - Frontend
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reposcore_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      cache:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - reposcore_network

  # ---------------------------------------------------------------------------
  # FastAPI Backend - REST API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: reposcore_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REDIS_URL=redis://cache:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - reposcore_network

# -----------------------------------------------------------------------------
# Volumes - Persistent data
# -----------------------------------------------------------------------------
volumes:
  redis_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks - Internal communication
# -----------------------------------------------------------------------------
networks:
  reposcore_network:
    driver: bridge
